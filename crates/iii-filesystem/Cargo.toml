[package]
name = "iii-filesystem"
version = "0.1.0"
edition = "2024"
license = "Elastic-2.0"
description = "Filesystem backends for iii worker VM sandboxes"

[lib]
path = "src/lib.rs"

[dependencies]
dashmap = "6"
libc = "0.2"
# Pinned: msb_krun_devices 0.1.39 uses libc::statx, which libc does not define for musl (breaks the Alpine iii-worker build).
msb_krun = "=0.1.16"

[target.'cfg(target_os = "macos")'.dependencies]
tempfile = "3"

[features]
default = []
embed-init = []

[dev-dependencies]
libc = "0.2"
tempfile = "3"
