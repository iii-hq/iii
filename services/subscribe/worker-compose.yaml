# iii.dev email signup API on iii Cloud. RESEND_API_KEY is a secret of the
# iii Cloud environment (Config & secrets), never a value in this file.
startup_timeout: 60s
stop_timeout: 10s
containers:
  http:
    worker: package://http
    version: "0.23.2"
  subscribe:
    worker: path://./workers/subscribe
    start_after: [http]
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_TEMPLATE_ID: 2960e2b7-5ece-41e1-901b-a8614d7f5226
      RESEND_FROM: Hello from iii <hello@email.iii.dev>
      RESEND_SUBJECT: Welcome to the iii community
      # Double opt-in: the confirmation email's template (by alias), which links
      # to {{{CONFIRM_URL}}}. The welcome above goes out once the link is clicked.
      RESEND_CONFIRM_TEMPLATE_ID: confirm-subscription
      RESEND_CONFIRM_SUBJECT: Confirm your iii subscription
      # Builds the confirmation link and the pages a click lands on.
      SITE_URL: https://iii.dev
      # source=segment: where a signup came from (the body's `source`, default
      # website) to the Resend segment its contact joins. ade posts from its
      # worker, server to server, so with no Origin header.
      RESEND_SEGMENTS: website=bf68b570-89d0-483a-9b94-6c655445f1d0,ade=41be697f-0e36-4cf4-824b-60dee92e2a97
      ALLOWED_ORIGINS: https://iii.dev,https://www.iii.dev,https://iii-preview.iii.dev
  # Added by `iii compose build` (0.26) to run the path:// worker in a VM
  # locally. iii Cloud builds that worker as a container and leaves this out.
  sandbox-libkrun:
    worker: package://api.workers.iii.dev/sandbox-libkrun
    version: "0.3.1"
