name: subscribe
description: iii.dev email signup, POST /api/subscribe (Resend contact + welcome email).
runtime:
  base_image: oven/bun:1.3
scripts:
  # Install from bun.lock before starting. Without node_modules, Bun falls back to
  # auto-install, which fetches the latest versions and leaves peer dependencies
  # unresolved: iii-sdk's OpenTelemetry packages then fail on '@opentelemetry/api'.
  # The iii Cloud image had no node_modules on the first deploy, so the worker
  # installs its own; when node_modules is already current this is a no-op.
  start: cd ../.. && bun install --frozen-lockfile --production && cd workers/subscribe && exec bun run index.ts
