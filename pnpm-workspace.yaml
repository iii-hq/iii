packages:
  - sdk/packages/node/iii
  - sdk/packages/node/iii-example
  - sdk/packages/node/iii-browser
  - sdk/packages/node/observability
  - sdk/packages/node/helpers
  - engine/src/workers/observability/ui
  - docs
  - website

overrides:
  # GHSA-68fv-2mgg-jv7q (high, fixed in 1.2.2): reached from the SDK packages'
  # dev tree (helpers > @vitest/coverage-v8 > magicast) and gated by
  # scripts/audit-sdk.mjs. Every dependent declares ^1.2.x.
  source-map-js: ^1.2.2
  # GHSA-g3hv-75wg-m249 (moderate, fixed in 11.0.1): typedoc 0.28.20 pins minimatch ^10.2.5,
  # which is vulnerable, and gated by scripts/audit-sdk.mjs via helpers > typedoc. Scoped to
  # typedoc so other minimatch consumers keep their range.
  typedoc>minimatch: ^11.0.1
