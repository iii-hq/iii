namespace: default
engine:
  url: ws://127.0.0.1:49199
  workers:
    configuration:
      adapter:
        name: fs
        config:
          directory: ./data/config-test-configuration
    iii-worker-manager:
      port: 49199
    "iii-worker-manager#rbac":
      host: 0.0.0.0
      port: 49135
      middleware_function_id: test::rbac-worker::middleware
      rbac:
        auth_function_id: test::rbac-worker::auth
        on_function_registration_function_id: test::rbac-worker::on-function-reg
        on_trigger_registration_function_id: test::rbac-worker::on-trigger-reg
        on_trigger_type_registration_function_id: test::rbac-worker::on-trigger-type-reg
        expose_functions:
          - match("test::ew::public::*")
          - match("engine::functions::list")
          - metadata:
              ew_public: true
    iii-stream:
      port: ${STREAMS_PORT:3112}
      host: 0.0.0.0
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: ./data/stream_store
    iii-http-functions:
      security:
        url_allowlist:
          - localhost
          - 127.0.0.1
        block_private_ips: false
        require_https: false
containers:
  state:
    worker: package://api.workers.iii.dev/state
    version: "0.22.2"
    config_name: state
    config_override:
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: ./data/state_store.db
  http:
    worker: package://api.workers.iii.dev/http
    version: "0.21.3"
    config_name: http
    config_override:
      host: 0.0.0.0
      port: 3199
      default_timeout: 30000
  pubsub:
    worker: package://api.workers.iii.dev/pubsub
    version: "0.21.2"
    config_name: pubsub
    config_override:
      adapter:
        name: local
  cron:
    worker: package://api.workers.iii.dev/cron
    version: "0.21.9"
    config_name: cron
    config_override:
      adapter:
        name: local
  queue:
    worker: package://api.workers.iii.dev/queue
    version: "0.21.5"
    config_name: queue
    config_override:
      adapter:
        name: builtin
        config:
          store_method: in_memory
