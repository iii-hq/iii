workers:
  - name: configuration
    config:
      adapter:
        name: fs
        config:
          directory: ./data/config-bridge-configuration

  - name: iii-worker-manager
    config:
      port: 49197

  - name: iii-stream
    config:
      port: 3114
      host: 127.0.0.1
      adapter:
        name: bridge
        config:
          bridge_url: ws://localhost:49198
