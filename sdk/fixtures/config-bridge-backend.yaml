workers:
  - name: configuration
    config:
      adapter:
        name: fs
        config:
          directory: ./data/config-bridge-backend-configuration

  - name: iii-worker-manager
    config:
      port: 49198

  - name: iii-stream
    config:
      port: 3113
      host: 0.0.0.0
      adapter:
        name: kv
        config:
          store_method: in_memory
