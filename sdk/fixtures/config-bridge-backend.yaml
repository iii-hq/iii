namespace: default
engine:
  url: ws://127.0.0.1:49198
  workers:
    configuration:
      adapter:
        name: fs
        config:
          directory: ./data/config-bridge-backend-configuration
    iii-worker-manager:
      port: 49198
    iii-stream:
      port: 3113
      host: 0.0.0.0
      adapter:
        name: kv
        config:
          store_method: in_memory
containers:
  state:
    worker: package://api.workers.iii.dev/state
    version: "0.22.2"
    config_name: state
    config_override:
      adapter:
        name: kv
        config:
          store_method: in_memory
  pubsub:
    worker: package://api.workers.iii.dev/pubsub
    version: "0.21.2"
    config_name: pubsub
    config_override:
      adapter:
        name: local
