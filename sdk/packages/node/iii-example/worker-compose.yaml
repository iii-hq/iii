workers:
  iii-example:
    source:
      path: .
      package_manifest: package.json
    artifact:
      kind: javascript-bundle
      workspace_root: .
      runtime: { name: bun, version: 1.3.5 }
      package_manager: { name: bun, version: 1.3.5 }
      lockfile: package.json
      install_command: [bun, install]
      build_command: [bun, build, src/index.ts, --outdir, dist]
      include: [src/index.ts]
    runtime:
      exec: [bun, ./src/index.ts]
    registry:
      description: Node SDK example worker
      license: Elastic-2.0
      tags: [example]
      dependencies: {}
      publish: false
    validation:
      interface: skipped
stacks:
  default:
    namespace: default
    containers:
      state:
        worker: package://state@next
      http:
        worker: package://http@next
      pubsub:
        worker: package://pubsub@next
      cron:
        worker: package://cron@next
      iii-example:
        worker: catalog://iii-example
        start_after: [state, http, pubsub, cron]
