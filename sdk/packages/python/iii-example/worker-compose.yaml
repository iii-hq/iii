workers:
  iii-example:
    source:
      path: .
      package_manifest: pyproject.toml
    artifact:
      kind: python-bundle
      workspace_root: .
      runtime: { name: python, version: 3.12.13 }
      package_manager: { name: uv, version: 0.12.5 }
      lockfile: uv.lock
      install_command: [uv, sync, --frozen]
      build_command: [uv, build]
      include: [src/main.py]
    runtime:
      exec: [uv, run, iii-example]
    registry:
      description: Python SDK example worker
      license: Elastic-2.0
      tags: [example]
      dependencies: {}
      publish: false
    validation:
      interface: skipped
stacks:
  default:
    namespace: default
    containers:
      state:
        worker: package://state@next
      http:
        worker: package://http@next
      pubsub:
        worker: package://pubsub@next
      cron:
        worker: package://cron@next
      iii-example:
        worker: catalog://iii-example
        start_after: [state, http, pubsub, cron]
