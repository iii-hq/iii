name: Load Benchmarks

# Capacity and resource benchmarks (crates/iii-loadtest): the engine alone in
# microVMs of fixed size, driven by real SDK workers. Every release, and every
# Monday on main for the trend in between. Results land on the gh-pages branch
# (loadtest/index.json + loadtest/runs/<id>.json) and iii.dev/benchmarks is
# rebuilt from them.

on:
  push:
    tags:
      - 'iii/v*'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Machine profiles: host, or <vcpus>x<MiB> microVMs'
        required: false
        default: 'host,1x512,2x1024,4x2048'
      scenarios:
        description: 'Scenarios (iii-loadtest scenarios lists them)'
        required: false
        default: 'rpc,fanout,filters,observers,source,match-keys,local,overload,connections'
      quick:
        description: 'Short steps, fewer levels: checks the pipeline, never published'
        type: boolean
        default: false
      publish:
        description: 'Publish to gh-pages and rebuild iii.dev/benchmarks'
        type: boolean
        default: true

permissions:
  contents: write # push the results to gh-pages
  actions: write # dispatch the website deploy

concurrency:
  # One run at a time: they would share the runner's cores, and gh-pages.
  group: loadtest-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  III_TELEMETRY_ENABLED: "false"

jobs:
  loadtest:
    name: Load benchmarks
    # A GitHub-hosted larger runner (Linux x64, 16 vCPUs) added to this
    # repository; its name is the label. Set the LOADTEST_RUNNER variable to
    # use another.
    runs-on: ${{ vars.LOADTEST_RUNNER || 'iii-loadtest-16-cores' }}
    timeout-minutes: 300
    env:
      PROFILES: ${{ inputs.profiles || 'host,1x512,2x1024,4x2048' }}
      SCENARIOS: ${{ inputs.scenarios || 'rpc,fanout,filters,observers,source,match-keys,local,overload,connections' }}
      QUICK: ${{ inputs.quick && '--quick' || '' }}
      PUBLISH: ${{ github.event_name != 'workflow_dispatch' || (inputs.publish && !inputs.quick) }}
    steps:
      - uses: actions/checkout@v4

      # Same rule as ci.yml's VM jobs: the runner user needs /dev/kvm.
      - name: Enable KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is missing on this runner: the microVM profiles cannot boot"
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core)'

      - name: Install system dependencies
        run: |
          sudo apt-get install -y libcap-ng-dev \
            || { sudo apt-get update && sudo apt-get install -y libcap-ng-dev; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: loadtest
          cache-on-failure: true

      - name: Build the engine, the load test and the guest init
        run: |
          cargo build --locked --release -p iii -p iii-loadtest
          # The microVM's PID 1, static (the same init iii's managed workers boot).
          cargo build --locked --release -p iii-init --target x86_64-unknown-linux-musl

      - name: Version
        id: meta
        run: |
          if [[ "$GITHUB_REF_NAME" == iii/v* ]]; then
            VERSION="${GITHUB_REF_NAME#iii/v}"
          else
            VERSION="$(target/release/iii --version)+$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run the suite
        run: |
          target/release/iii-loadtest suite \
            --profiles "$PROFILES" \
            --scenarios "$SCENARIOS" \
            $QUICK \
            --krunfw engine/firmware/libkrunfw-linux-x86_64.so \
            --init target/x86_64-unknown-linux-musl/release/iii-init \
            --out loadtest-results

      - name: Summarize
        if: always()
        run: |
          test -f loadtest-results/results.json || exit 0
          target/release/iii-loadtest export loadtest-results \
            --version "${{ steps.meta.outputs.version }}" \
            --machine "GitHub-hosted runner, $(nproc) vCPUs" \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat loadtest-results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-${{ steps.meta.outputs.version }}
          path: |
            loadtest-results/results.json
            loadtest-results/summary.json
            loadtest-results/report.md
            loadtest-results/*/*/config.yaml
            loadtest-results/*/*/engine.log
            loadtest-results/*/*/console.log
          retention-days: 90

      - name: Publish to gh-pages
        if: env.PUBLISH == 'true'
        run: |
          git fetch --depth=1 origin gh-pages
          git worktree add --detach ../gh-pages FETCH_HEAD
          target/release/iii-loadtest publish loadtest-results/summary.json --pages ../gh-pages
          cd ../gh-pages
          git add loadtest
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "loadtest: ${{ steps.meta.outputs.version }}"
          # The criterion workflow pushes to gh-pages too: retry on a race.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:gh-pages; then exit 0; fi
            git fetch --depth=1 origin gh-pages
            git rebase FETCH_HEAD
            sleep $((attempt * 5))
          done
          exit 1

      - name: Rebuild iii.dev/benchmarks
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-website.yml --repo "${{ github.repository }}" --ref main
