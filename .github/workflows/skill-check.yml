name: Skill check

on:
  pull_request:
    paths:
      - "docs/next/**/*.md"
      - "docs/next/**/*.mdx"
      - ".skill-check.yaml"
      - ".github/workflows/skill-check.yml"
  push:
    branches: [main]
    paths:
      - "docs/next/**/*.md"
      - "docs/next/**/*.mdx"
      - ".skill-check.yaml"
      - ".github/workflows/skill-check.yml"

permissions:
  contents: read # report-only; the action no longer commits back
  pull-requests: write # for the sticky PR comment
  actions: write # for the persistent AI skip-cache (v0.3+)

jobs:
  verify:
    name: Verify docs skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run iii-skill-check
        uses: iii-hq/skills-and-validation@e568f7490b9ca6cffc86c8a8f36d2ea26af68e8a # v0.4
        with:
          write: false
          scope: pr-diff
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
