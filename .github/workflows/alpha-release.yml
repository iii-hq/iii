name: Alpha Release (npm download verification)

on:
  push:
    branches:
      - feat/npm-oidc-alpha-validation

permissions:
  contents: read

jobs:
  verify-download:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public Helpers tarball
        env:
          EXPECTED_INTEGRITY: 'sha512-rw71XkJxdBxRq0stZChaBaLWvpnozRl6iizuD/cfRhwmdgEHXnxt87KLa6n1o6zD7SXjqqm/VIz1ZqXiwBkiMA=='
        run: |
          url=https://registry.npmjs.org/@iii-dev/helpers/-/helpers-0.27.0-alpha.0.oidc.1.tgz
          tarball="$RUNNER_TEMP/helpers.tgz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 15 --output "$tarball" "$url"
          actual="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          test "$actual" = "$EXPECTED_INTEGRITY"
          echo 'Public tarball integrity verified.'
