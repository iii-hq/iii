name: Create Tag

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Release target'
        required: true
        type: choice
        options:
          - iii
      bump:
        description: 'Version bump type (ignored when version_override is set; none otherwise requires a pre-release label)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch
      prerelease:
        description: 'Pre-release label (none = stable release)'
        required: true
        type: choice
        options:
          - none
          - rc
        default: none
      version_override:
        description: 'Exact version, e.g. 0.25.0-rc.1. Required outside main (RC only); overrides bump. Publishes the selected branch.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run (creates -dry-run.N tag, builds without publishing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# Serialize preparation across branches: version/tag checks share one namespace.
concurrency:
  group: create-tag-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-tag:
    name: Bump Versions & Create Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.III_CI_APP_ID }}
          private-key: ${{ secrets.III_CI_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Pre-flight checks
        id: preflight
        env:
          SOURCE_REF_TYPE: ${{ github.ref_type }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          TARGET: ${{ inputs.target }}
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          if [[ "$SOURCE_REF_TYPE" != "branch" ]]; then
            echo "::error::Select a branch, not a tag, for release preparation"
            exit 1
          fi
          BRANCH=$(git symbolic-ref --quiet --short HEAD)
          if [[ "$BRANCH" != "$SOURCE_BRANCH" ]]; then
            echo "::error::Checkout does not match the selected source branch"
            exit 1
          fi
          if [[ "$BRANCH" != "main" ]]; then
            if [[ "$PRERELEASE" != "rc" ]]; then
              echo "::error::Only RC releases are allowed outside main; stable releases require main"
              exit 1
            fi
            if [[ -z "$VERSION_OVERRIDE" ]]; then
              echo "::error::RC releases outside main require version_override (e.g. 0.25.0-rc.1)"
              exit 1
            fi
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # bump=none only iterates an existing pre-release train, so it
          # requires a pre-release label. Use patch/minor/major to START a
          # train (they pick the base); none cannot infer one.
          if [[ -z "$VERSION_OVERRIDE" && "$BUMP" == "none" && "$PRERELEASE" == "none" ]]; then
            echo "::error::bump 'none' requires the rc pre-release label. Use patch/minor/major for a stable release."
            exit 1
          fi

          if [[ "$TARGET" == "iii" ]]; then
            for f in Cargo.toml \
                     engine/Cargo.toml \
                     sdk/packages/rust/iii/Cargo.toml \
                     sdk/packages/rust/observability/Cargo.toml \
                     sdk/packages/rust/helpers/Cargo.toml \
                     sdk/packages/node/iii/package.json \
                     sdk/packages/node/iii-browser/package.json \
                     sdk/packages/node/observability/package.json \
                     sdk/packages/node/helpers/package.json \
                     sdk/packages/python/iii/pyproject.toml \
                     sdk/packages/python/observability/pyproject.toml \
                     sdk/packages/python/helpers/pyproject.toml \
                     crates/iii-filter/Cargo.toml \
                     crates/scaffolder-core/Cargo.toml \
                     crates/motia-tools/Cargo.toml; do
              if [[ ! -f "$f" ]]; then
                echo "::error::$f not found"
                exit 1
              fi
            done
          fi

      - name: Calculate versions
        id: versions
        env:
          TARGET: ${{ inputs.target }}
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$TARGET" == "iii" ]]; then
            current_version_file="engine/Cargo.toml"
          else
            echo "::error::unknown target: $TARGET"
            exit 1
          fi

          extra_args=()
          if [[ "$DRY_RUN" == "true" ]]; then
            extra_args+=(--dry-run)
          fi
          python3 .github/scripts/calculate_release_version.py \
            --target "$TARGET" \
            --bump "$BUMP" \
            --prerelease "$PRERELEASE" \
            --version-override "$VERSION_OVERRIDE" \
            --inflight-reachable-from HEAD \
            "${extra_args[@]}" \
            --current-version-file "$current_version_file"

      - name: Summarize selected release
        env:
          SOURCE_BRANCH: ${{ steps.preflight.outputs.branch }}
          SOURCE_SHA: ${{ steps.preflight.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          CURRENT_VERSION: ${{ steps.versions.outputs.current }}
          SELECTED_VERSION: ${{ steps.versions.outputs.version }}
          SELECTED_TAG: ${{ steps.versions.outputs.tag }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          {
            printf '## Release selection\n\n'
            printf -- '- Source branch: `%s`\n' "$SOURCE_BRANCH"
            printf -- '- Source commit: `%s`\n' "$SOURCE_SHA"
            printf -- '- Current manifest: `%s`\n' "$CURRENT_VERSION"
            printf -- '- Selected version: `%s`\n' "$SELECTED_VERSION"
            printf -- '- Tag: `%s`\n' "$SELECTED_TAG"
            if [[ -n "$VERSION_OVERRIDE" ]]; then
              printf '\nExplicit version selected; bump was ignored. This releases the checked-out source commit.\n'
            fi
            if [[ "$DRY_RUN" == "true" ]]; then
              printf '\nDry run: pushes a dry-run tag, but does not update any branch or publish packages.\n'
            elif [[ "$SOURCE_BRANCH" == "main" ]]; then
              printf '\nThe release preparation commit is pushed to main and tagged.\n'
            else
              printf '\nOnly the tag is pushed. The preparation commit is reachable through it; neither main nor the source branch is updated. This release updates the shared rc channel, never latest.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Stable releases pull their docs from docs/next/, so it must be prepared.
      # Validate even on dry runs so a release cannot be tagged without docs.
      - name: Validate docs ready for stable release
        id: docs_check
        if: inputs.target == 'iii' && inputs.prerelease == 'none'
        run: |
          python3 .github/scripts/pin_docs.py validate \
            --docs-dir docs

          # The generated CLI reference rotates into the release docs with
          # the rest of docs/next/. It is regenerated and drift-gated by the
          # cli-docs-built CI job on every PR; here we only require that the
          # page exists so a stable release can't ship without it.
          if [[ ! -s "docs/next/cli-reference/index.mdx" ]]; then
            echo "::error::docs/next/cli-reference/index.mdx is missing or empty. Run scripts/generate-cli-docs.sh (or 'make cli-docs') and commit the result."
            exit 1
          fi

      - name: Notify Slack — release blocked (missing docs)
        if: always() && steps.docs_check.outcome == 'failure'
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "Release blocked — missing documentation"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":no_entry: *Release blocked* — Next docs not ready for `iii v${{ steps.versions.outputs.version }}`.\nExpected a `Next` block in `docs/docs.json`, a non-empty `docs/next/` folder, and the generated `docs/next/cli-reference/` pages before tagging. Prepare the docs, then re-run."
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "Triggered by ${{ github.actor }} | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"

      - name: Update iii manifests
        if: inputs.target == 'iii' && inputs.dry_run != true
        env:
          NEW_VERSION: ${{ steps.versions.outputs.version }}
          PY_VERSION: ${{ steps.versions.outputs.python_version }}
        run: |
          python3 .github/scripts/bump_manifests.py \
            --root . \
            --version "${NEW_VERSION}" \
            --python-version "${PY_VERSION}"

      # Update docs from docs/next/ on stable releases. rotate dispatches on the
      # version: minor/major rotate (archive + promote + bump Next); patch just
      # refreshes the current Latest in place (no archive, no Next bump).
      - name: Update documentation versions
        if: inputs.target == 'iii' && inputs.dry_run != true && inputs.prerelease == 'none'
        env:
          NEW_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          python3 .github/scripts/pin_docs.py rotate \
            --docs-dir docs \
            --version "${NEW_VERSION}"

      - name: Sync Cargo.lock
        if: inputs.target == 'iii' && inputs.dry_run != true
        run: cargo update --workspace

      - name: Verify Cargo.lock is consistent
        if: inputs.target == 'iii' && inputs.dry_run != true
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Validate version updates
        if: inputs.dry_run != true
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ steps.versions.outputs.version }}
          PY_VERSION: ${{ steps.versions.outputs.python_version }}
        run: |
          check_cargo() {
            local actual
            actual=$(grep '^version = ' "$1" | head -n1 | cut -d'"' -f2)
            if [[ "$actual" != "$2" ]]; then
              echo "::error::$1 version mismatch: expected $2, got $actual"
              exit 1
            fi
            echo "  $1 -> $actual"
          }

          check_json() {
            local actual
            actual=$(grep '"version":' "$1" | head -n1 | cut -d'"' -f4)
            if [[ "$actual" != "$2" ]]; then
              echo "::error::$1 version mismatch: expected $2, got $actual"
              exit 1
            fi
            echo "  $1 -> $actual"
          }

          check_workspace_dep() {
            # $1=file $2=expected_version $3=dep_name (default iii-observability)
            local actual dep="${3:-iii-observability}"
            actual=$(grep -E "^${dep}\s*=" "$1" | sed -E 's/.*version\s*=\s*"([^"]+)".*/\1/')
            if [[ "$actual" != "$2" ]]; then
              echo "::error::$1 ${dep} dep version mismatch: expected $2, got $actual"
              exit 1
            fi
            echo "  $1 ${dep} -> $actual"
          }

          check_pep440_pin() {
            # $1=file $2=dep_name $3=expected_version
            local actual
            actual=$(grep -oE "\"${2}==[^\"]+\"" "$1" | head -n1 | sed -E 's/.*==([^"]+)".*/\1/')
            if [[ "$actual" != "$3" ]]; then
              echo "::error::$1 ${2} pin mismatch: expected $3, got $actual"
              exit 1
            fi
            echo "  $1 ${2} -> $actual"
          }

          echo "Validating version updates..."

          if [[ "$TARGET" == "iii" ]]; then
            check_cargo "engine/Cargo.toml" "$VERSION"
            check_cargo "sdk/packages/rust/iii/Cargo.toml" "$VERSION"
            check_cargo "sdk/packages/rust/observability/Cargo.toml" "$VERSION"
            check_cargo "sdk/packages/rust/helpers/Cargo.toml" "$VERSION"
            check_json "sdk/packages/node/iii/package.json" "$VERSION"
            check_json "sdk/packages/node/iii-browser/package.json" "$VERSION"
            check_json "sdk/packages/node/observability/package.json" "$VERSION"
            check_json "sdk/packages/node/helpers/package.json" "$VERSION"
            check_cargo "sdk/packages/python/iii/pyproject.toml" "$PY_VERSION"
            check_cargo "sdk/packages/python/observability/pyproject.toml" "$PY_VERSION"
            check_cargo "sdk/packages/python/helpers/pyproject.toml" "$PY_VERSION"
            check_cargo "Cargo.toml" "$VERSION"
            check_workspace_dep "Cargo.toml" "$VERSION"
            check_workspace_dep "Cargo.toml" "$VERSION" "iii-filter"
            check_pep440_pin "sdk/packages/python/iii/pyproject.toml" "iii-helpers" "$PY_VERSION"
            check_pep440_pin "sdk/packages/python/observability/pyproject.toml" "iii-helpers" "$PY_VERSION"
          fi

          echo "All versions validated."

      - name: Check tag does not exist
        env:
          TAG: ${{ steps.versions.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "iii-ci[bot]"
          git config user.email "iii-ci[bot]@users.noreply.github.com"

      - name: Commit release preparation
        if: inputs.dry_run != true
        env:
          TARGET: ${{ inputs.target }}
          TAG: ${{ steps.versions.outputs.tag }}
        run: |
          git add -A
          git commit -m "chore: bump versions for release -- $TARGET($TAG)" \
            -m "Co-authored-by: iii harness (codex/gpt-6-astra) <noreply@iii.dev>"

      # RCs from another branch keep the preparation commit only on the tag.
      - name: Push main branch
        if: inputs.dry_run != true && steps.preflight.outputs.branch == 'main'
        run: git push origin HEAD:refs/heads/main

      - name: Create and push tag
        env:
          TAG: ${{ steps.versions.outputs.tag }}
          SOURCE_BRANCH: ${{ steps.preflight.outputs.branch }}
          SOURCE_SHA: ${{ steps.preflight.outputs.sha }}
        run: |
          git tag -a "$TAG" -m "Release $TAG" \
            -m "Source branch: $SOURCE_BRANCH" -m "Source commit: $SOURCE_SHA"
          git push origin "refs/tags/$TAG"
          echo "Created tag: $TAG"

      # Tell the templates repo to bump its iii-sdk / iii-observability pins to
      # match this release. Stable releases only — prereleases aren't what the
      # templates should pin to. Uses a dedicated III_CI_APP token scoped to
      # iii-hq/templates (the app must be installed there with Contents: write).
      - name: Generate templates token
        id: templates_token
        if: inputs.target == 'iii' && inputs.dry_run != true && inputs.prerelease == 'none'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.III_CI_APP_ID }}
          private-key: ${{ secrets.III_CI_APP_PRIVATE_KEY }}
          owner: iii-hq
          repositories: templates

      - name: Dispatch templates version bump
        if: inputs.target == 'iii' && inputs.dry_run != true && inputs.prerelease == 'none'
        env:
          GH_TOKEN: ${{ steps.templates_token.outputs.token }}
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          jq -nc --arg v "$VERSION" \
            '{event_type: "iii-release", client_payload: {version: $v}}' \
            | gh api repos/iii-hq/templates/dispatches --input -

      - name: Notify Slack
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "${{ inputs.dry_run == true && '[DRY RUN] ' || '' }}Tag created for release"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ inputs.dry_run == true && ':test_tube: *Dry Run — Tag Preview*' || ':label: *Tag Created*' }}\n\n:package: ${{ inputs.target }}: `${{ steps.versions.outputs.tag }}`\nPre-release: `${{ inputs.prerelease }}`\nTriggered by: ${{ github.actor }}${{ inputs.dry_run == true && '\n\n_Dry-run tag pushed; no branch updates or package uploads_' || '' }}"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
