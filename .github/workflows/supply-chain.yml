name: Supply Chain

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'skills/**'
      - 'website/**'
      - '**/*.md'
      - '**/*.mdx'
      - '.cursor/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'skills/**'
      - 'website/**'
      - '**/*.md'
      - '**/*.mdx'
      - '.cursor/**'
  schedule:
    # Weekly, so advisories published against an unchanged lockfile still surface.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-advisories:
    name: Rust advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans

  node-advisories:
    name: Node advisories (SDK packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # pnpm audit reads pnpm-lock.yaml; no install needed.
      - name: Audit SDK packages
        run: node scripts/audit-sdk.mjs
