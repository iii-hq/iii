name: Release iii (npm RC recovery)

on:
  push:
    branches:
      - feat/npm-oidc-rc3-recovery

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish 0.27.0-rc.3 to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Node packages
        run: >-
          pnpm
          --filter '@iii-dev/helpers'
          --filter '@iii-dev/observability'
          --filter iii-sdk
          --filter iii-browser-sdk
          build

      - name: Publish RC packages to npm
        run: >-
          pnpm
          --filter '@iii-dev/helpers'
          --filter '@iii-dev/observability'
          --filter iii-sdk
          --filter iii-browser-sdk
          -r publish
          --no-git-checks
          --access public
          --tag rc
