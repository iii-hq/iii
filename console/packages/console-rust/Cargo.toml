# Tombstone for the removed legacy iii-console (MOT-3619).
#
# The real console (an axum server embedding a React SPA) was removed in favour
# of the iii console in ADE (`iii trigger compose::add worker=ade`). This crate
# only builds a placeholder `iii-console` binary that prints a removal notice and
# exits non-zero, so older `iii` CLIs that still run `iii update` or
# `iii console` find an `iii-console` release asset instead of failing.
#
# TODO(MOT-3619): stop shipping the iii-console tombstone after N releases (TBD).
[package]
name = "iii-console"
version = "0.24.5-rc.2"
edition = "2021"
description = "Removed: placeholder that points to the iii console in ADE"
license = "Apache-2.0"
repository = "https://github.com/iii-hq/iii"

[dependencies]
