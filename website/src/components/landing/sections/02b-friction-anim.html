<!-- FRICTION ANIMATION — the old way vs the iii way, drawn on a canvas.
     The drawing and the copy are driven by scripts/08-friction-anim.html;
     everything here is the frame it renders into. -->
<section class="fanim" id="friction-anim" aria-label="From friction to a live system">
  <style>
    .fanim {
      padding: 0 0 40px;
    }
    /* Full-bleed: the drawing runs the width of the section, no frame. */
    .fanim-stage {
      position: relative;
      height: min(86vh, 820px);
      min-height: 600px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Chivo Mono", ui-monospace, monospace;
      overflow: hidden;
      user-select: none;
    }
    .fanim-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .fanim-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 36px;
      border-bottom: 1px solid var(--rule);
    }
    .fanim-mark {
      font-weight: 600;
      font-size: 18px;
      letter-spacing: -0.02em;
    }
    .fanim-ways {
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .fanim-ways button {
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-ghost);
      transition: color 0.2s ease;
    }
    .fanim-ways button.on {
      color: var(--ink);
    }

    /* The three tensions. Each one docks to its moment in the story when it is
       the current one, and parks in the right margin when it is not. */
    .fanim-tensions {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .fanim-tension {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      transition:
        left 0.8s cubic-bezier(0.4, 0, 0.2, 1),
        top 0.8s cubic-bezier(0.4, 0, 0.2, 1),
        opacity 0.5s ease;
    }
    .fanim-tension-head {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      letter-spacing: 0.01em;
      color: var(--ink-ghost);
    }
    .fanim-tension.on .fanim-tension-head {
      color: var(--ink);
    }
    .fanim-tension-bar {
      flex: 0 0 auto;
      width: 3px;
      height: 15px;
      background: transparent;
    }
    .fanim-tension.on .fanim-tension-bar {
      background: var(--accent);
    }
    .fanim-tension-body {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition:
        max-height 0.55s ease,
        opacity 0.45s ease;
    }
    .fanim-tension.on .fanim-tension-body {
      max-height: 220px;
      opacity: 1;
    }
    .fanim-tension-body p {
      margin: 9px 0 0;
      padding-left: 13px;
      font-size: 15px;
      line-height: 1.65;
      color: var(--ink-faint);
      text-wrap: pretty;
    }

    @media (max-width: 900px) {
      .fanim {
        padding: 0 18px 32px;
      }
      .fanim-stage {
        height: min(90vh, 720px);
      }
    }
  </style>

  <div class="fanim-stage" id="fanim-stage">
    <canvas class="fanim-canvas" id="fanim-canvas" aria-hidden="true"></canvas>

    <div class="fanim-bar">
      <span class="fanim-mark">iii</span>
      <div class="fanim-ways">
        <button type="button" class="on" data-way="0">the old way</button>
        <button type="button" data-way="1">the iii way</button>
      </div>
    </div>

    <div class="fanim-tensions" id="fanim-tensions"></div>

  </div>
</section>
