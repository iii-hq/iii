registration_namespace_grace_ms: 5000

# Binds sandbox::* to a sandbox adapter worker; unset, sandbox::* answers S303.
# sandbox:
#   adapter: sandbox-libkrun
#   namespace: default

# Only workers that are part of the engine lifecycle belong here. Project
# workers such as http, state, cron, queue, pubsub, and bridge belong in
# worker-compose.yaml.
workers:
  - name: iii-stream
    config:
      port: ${STREAM_PORT:3112}
      host: ${STREAM_HOST:127.0.0.1}
      adapter:
        name: redis
        config:
          redis_url: ${REDIS_URL:redis://localhost:6379}

  - name: configuration
    config:
      adapter:
        name: fs
        config:
          directory: ./config
      ttl_seconds: 0
