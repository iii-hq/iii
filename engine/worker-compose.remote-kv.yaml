# namespace: default
engine:
  workers:
    iii-stream:
      port: ${STREAM_PORT:31112}
      host: 127.0.0.1
      adapter:
        name: bridge
        config:
          bridge_url: ws://localhost:49133
containers:
  http:
    worker: package://api.workers.iii.dev/http
    version: "0.21.3"
    config_name: http
    config_override:
      port: ${API_PORT:3111}
      host: 127.0.0.1
      default_timeout: 30000
      concurrency_request_limit: 1024
      cors:
        allowed_origins:
          - http://localhost:3000
          - http://localhost:5173
        allowed_methods: [GET, POST, PUT, DELETE, OPTIONS]
