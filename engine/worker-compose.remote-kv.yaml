workers: {}

stacks:
  default:
    namespace: default
    containers:
      http:
        worker: package://api.workers.iii.dev/http@0.21.3
        config:
          port: ${API_PORT:-3111}
          host: 127.0.0.1
          default_timeout: 30000
          concurrency_request_limit: 1024
          cors:
            allowed_origins:
              - http://localhost:3000
              - http://localhost:5173
            allowed_methods: [GET, POST, PUT, DELETE, OPTIONS]
