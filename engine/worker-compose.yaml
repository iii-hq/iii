workers: {}

stacks:
  default:
    namespace: default
    containers:
      state:
        worker: package://api.workers.iii.dev/state@0.22.2
        config:
          adapter:
            name: kv
            config:
              store_method: file_based
              file_path: ./data/state_store.db
      http:
        worker: package://api.workers.iii.dev/http@0.21.3
        config:
          port: 3111
          host: 127.0.0.1
          default_timeout: 30000
          concurrency_request_limit: 1024
          cors:
            allowed_origins:
              - http://localhost:3000
              - http://localhost:5173
            allowed_methods: [GET, POST, PUT, DELETE, OPTIONS]
      pubsub:
        worker: package://api.workers.iii.dev/pubsub@0.21.2
      cron:
        worker: package://api.workers.iii.dev/cron@0.21.9
